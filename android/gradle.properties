# Do NOT add -Dfile.encoding=UTF-8 here. On Korean Windows the test worker JVM uses the system
# encoding (MS949); a UTF-8 daemon then hands it a classpath it cannot read under this repository's
# Korean path, and every test fails with ClassNotFoundException. Kotlin sources are read as UTF-8 anyway.
org.gradle.jvmargs=-Xmx3g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 저장소 경로에 한글(수업 자료 등)이 있다. AGP는 Windows에서 비 ASCII 경로를 기본으로 거부하므로 확인 후 허용한다.
android.overridePathCheck=true
