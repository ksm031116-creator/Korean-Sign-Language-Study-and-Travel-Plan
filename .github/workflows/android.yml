# Android 품질 게이트 (구현 계획 Phase 1): PR·push 마다 단위 테스트(아키텍처 규칙 포함), Lint, 릴리스 빌드.
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # JVM 모듈 테스트 + Android 모듈은 debug 변형만(release 변형은 같은 테스트의 반복). 릴리스는 빌드·Lint 로 확인.
      - name: Unit tests, architecture rules, lint, release build
        run: ./gradlew :domain:test :domain:jacocoTestCoverageVerification :testing:test testDebugUnitTest :app:compileReleaseUnitTestKotlin lint assembleRelease --console=plain
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: android/*/build/reports/
